name: Deploy Cloudflare Backend
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, production]
        default: dev
        required: true
permissions:
  contents: read
concurrency:
  group: deploy-backend-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    # Deliberately disabled until resources, credentials and cutover are reviewed.
    if: >-
      vars.CLOUDFLARE_BACKEND_ENABLED == 'true' &&
      ((inputs.environment == 'dev' && github.ref == 'refs/heads/dev') ||
      (inputs.environment == 'production' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: cp .dev.vars.example .dev.vars
      - run: npm run types
      - run: npm run typecheck && npm test
      - run: python scripts/deployment_check.py "$TARGET_ENV"
      - run: npx wrangler d1 migrations apply DB --remote --config "wrangler.$TARGET_ENV.jsonc"
      - run: npx wrangler deploy --config "wrangler.$TARGET_ENV.jsonc"
