processing:
  frame_rate: 0.5 # One sample every two seconds
  queue_size: 100 # Backpressure bounds memory without dropping frames
  timeout: 1800 # One deadline for the entire chunk

emblem_detection:
  enabled: true
  template_method: "TM_CCOEFF_NORMED"
  template_threshold: 0.5
  templates_dir: "templates/"

right_edge_detection:
  enabled: true
  threshold: 0.88
  templates_dir: "templates/"
  crop_margin_percent: 5

ocr:
  confidence_threshold: 0.5
  min_matchup_interval: 10

supabase:
  storage_bucket: "detections"
  batch_size: 10
  connection_timeout: 30
  retry_attempts: 3

logging:
  level: "INFO"

test_mode:
  data_directory: "test_data"
